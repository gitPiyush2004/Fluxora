<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fluxora — Every Move, Smarter. Purchase orders, carrier quotes and shipment tracking in one place." />
    <title>Fluxora — Every Move, Smarter</title>
    <!-- Applies the saved theme before first paint (no flash). A file, not inline, so the CSP can forbid inline scripts. -->
    <script src="/theme.js"></script>
    <!-- Opening splash: the Fluxora "F" on black. Styled here so it paints before the app's CSS and JavaScript
         arrive; React adds the "done" class once the session check has finished (see Splash in src/app.tsx). -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #000; transition: opacity 0.6s ease, visibility 0.6s; }
      #splash svg { width: 88px; height: 88px; animation: splash-in 0.7s ease-out; transition: transform 0.6s ease; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash.done svg { transform: scale(1.3); }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.85); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="#4166F0">
        <path d="M16 44C19 30 28 13 46 9L94 8.5C96 8.5 96.6 10 95.6 11.6C91 19.5 86 28 74 29L47 29C34 29.5 22 35 16 44Z" />
        <path d="M5 91C6 74 10 56 30 42C35 39.6 40 38 46 38L75 38C77 38 77.8 39.6 76.6 41.4C72 49 66 57.5 56 58L42 58C35 58.5 32 62 30 69C27 79 20 89 5 91Z" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
