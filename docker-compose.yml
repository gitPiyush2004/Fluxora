# Local full stack: MongoDB + Redis + API + web (nginx).
#   cp .env.example .env   (set SESSION_SECRET; optionally GOOGLE_CLIENT_ID)
#   docker compose up --build
#   docker compose exec server node dist/scripts/seed.js     # demo data
# Web: http://localhost:8080
name: fluxora

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # The compiled image runs with NODE_ENV=production unless overridden here. Production needs
      # RESEND_API_KEY for email sign-in links; or set NODE_ENV=development to print links in the log.
      MONGODB_URI: mongodb://mongo:27017/fluxora
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:8080
      SERVER_URL: http://localhost:8080
      PORT: "4100"
      TRUST_PROXY: "1"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
